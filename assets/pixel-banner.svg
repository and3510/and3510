<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .grid { fill: none; stroke: #161b22; stroke-width: 1; }
      .px { shape-rendering: crispEdges; }
    </style>
  </defs>

  <rect class="bg" width="900" height="220" rx="0"/>

  <!-- pixel grid texture -->
  <g class="grid" opacity="0.5">
    <path d="M0 0 H900 M0 20 H900 M0 40 H900 M0 60 H900 M0 80 H900 M0 100 H900 M0 120 H900 M0 140 H900 M0 160 H900 M0 180 H900 M0 200 H900"/>
    <path d="M0 0 V220 M40 0 V220 M80 0 V220 M120 0 V220 M160 0 V220 M200 0 V220 M240 0 V220 M280 0 V220 M320 0 V220 M360 0 V220 M400 0 V220 M440 0 V220 M480 0 V220 M520 0 V220 M560 0 V220 M600 0 V220 M640 0 V220 M680 0 V220 M720 0 V220 M760 0 V220 M800 0 V220 M840 0 V220 M880 0 V220"/>
  </g>

  <!-- pixel computer/terminal icon, block = 10px -->
  <g class="px">
    <!-- monitor frame -->
    <rect x="40" y="50" width="220" height="140" fill="#39d353"/>
    <rect x="50" y="60" width="200" height="110" fill="#0d1117"/>
    <!-- screen scanlines -->
    <rect x="50" y="60" width="200" height="110" fill="#012f1f"/>
    <!-- prompt ">" -->
    <rect x="65" y="90" width="10" height="10" fill="#39d353"/>
    <rect x="75" y="100" width="10" height="10" fill="#39d353"/>
    <rect x="65" y="110" width="10" height="10" fill="#39d353"/>
    <!-- cursor block -->
    <rect x="95" y="100" width="60" height="14" fill="#39d353">
      <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
    </rect>
    <!-- stand -->
    <rect x="130" y="190" width="40" height="12" fill="#39d353"/>
    <rect x="110" y="202" width="80" height="10" fill="#39d353"/>
  </g>

  <!-- title text, pixel style font -->
  <text x="300" y="105" font-family="'Courier New', monospace" font-weight="bold" font-size="42" fill="#39d353" letter-spacing="2">ANDERSON</text>
  <text x="300" y="150" font-family="'Courier New', monospace" font-weight="bold" font-size="42" fill="#e6edf3" letter-spacing="2">DO VALE</text>
  <text x="302" y="180" font-family="'Courier New', monospace" font-size="16" fill="#8b949e">devops_engineer --automation --cloud --ci-cd</text>

  <!-- small decorative pixel dots -->
  <g fill="#39d353">
    <rect x="850" y="30" width="10" height="10"/>
    <rect x="830" y="50" width="10" height="10"/>
    <rect x="860" y="60" width="10" height="10"/>
    <rect x="840" y="180" width="10" height="10"/>
    <rect x="870" y="160" width="10" height="10"/>
  </g>
</svg>
